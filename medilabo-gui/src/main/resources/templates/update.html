<!DOCTYPE html>
<html
  lang="fr"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Page</title>
    <link href="/css/medilabo-style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Bandeau supérieur -->
    <div class="top-banner">
      <div class="banner-content">
        <div
          class="logo-img"
          style="
            border: 6px solid #25648f;
            border-radius: 18px;
            padding: 0;
            background: #e0f2fa;
            box-shadow: 0 2px 8px rgba(37, 100, 143, 0.07);
            width: 90px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            top: 10px;
          "
        >
          <img
            src="/img/medilabo-logo.png"
            alt="MédiLabo Solutions"
            style="
              width: 80px;
              height: 56px;
              object-fit: cover;
              border-radius: 10px;
              display: block;
              margin: 0;
            "
          />
        </div>
        <div style="display: flex; align-items: center; margin-left: auto">
          <a
            th:href="@{/api/patient/list}"
            class="btn btn-login retour-btn"
            style="
              min-width: 200px;
              max-width: 200px;
              margin-right: 5px;
              text-align: center;
            "
            >Retour à la liste</a
          >
          <a
            th:href="@{/logout}"
            class="btn btn-danger logout-btn"
            style="margin-left: 0"
            >Déconnexion</a
          >
        </div>
      </div>
    </div>
    <div style="width: 100%; margin-top: 2.5rem; text-align: center">
      <h2
        style="
          color: #3b5998;
          font-weight: 700;
          font-size: 2.2rem;
          letter-spacing: 1px;
          margin: 0;
        "
      >
        Modifier le patient
      </h2>
    </div>

    <div
      style="
        max-width: 2200px;
        margin: 40px auto 32px auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 4px 24px rgba(59, 89, 152, 0.1);
        padding: 2.5rem 10vw 2.5rem 10vw;
      "
    >
      <form
        action="#"
        th:action="@{/api/patient/update/{id}(id=${patient.id})}"
        method="post"
        style="
          display: flex;
          flex-direction: column;
          gap: 1.2rem;
          width: 100%;
          max-width: 1200px;
          margin: 0 auto;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 0.1rem;
          "
        >
          <label
            for="lastname"
            style="
              font-weight: 600;
              color: #3b5998;
              text-align: left;
              min-width: 180px;
            "
            >Nom</label
          >
          <input
            type="text"
            id="lastname"
            name="lastname"
            placeholder="Nom"
            required
            class="form-control"
            style="
              flex: 1;
              min-width: 350px;
              max-width: 1000px;
              border: 1.5px solid #3b8dbc;
              background: #f4f8fb;
              color: #2c3e50;
            "
          />
        </div>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 0.1rem;
          "
        >
          <label
            for="firstname"
            style="
              font-weight: 600;
              color: #3b5998;
              text-align: left;
              min-width: 180px;
            "
            >Prénom</label
          >
          <input
            type="text"
            id="firstname"
            name="firstname"
            placeholder="Prénom"
            required
            class="form-control"
            style="
              flex: 1;
              min-width: 350px;
              max-width: 1000px;
              border: 1.5px solid #3b8dbc;
              background: #f4f8fb;
              color: #2c3e50;
            "
          />
        </div>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 0.1rem;
          "
        >
          <label
            for="birthdate"
            style="
              font-weight: 600;
              color: #3b5998;
              text-align: left;
              min-width: 180px;
            "
            >Date de naissance</label
          >
          <input
            type="text"
            id="birthdate"
            name="birthdate"
            placeholder="JJ/MM/AAAA"
            required
            class="form-control"
            style="
              flex: 1;
              min-width: 350px;
              max-width: 1000px;
              border: 1.5px solid #3b8dbc;
              background: #f4f8fb;
              color: #2c3e50;
            "
          />
        </div>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 0.1rem;
          "
        >
          <label
            style="
              font-weight: 600;
              color: #3b5998;
              text-align: left;
              min-width: 180px;
            "
            >Genre</label
          >
          <div style="display: flex; gap: 18px">
            <label style="font-weight: 500; color: #2c3e50"
              ><input type="radio" id="M" name="gender" value="M" checked />
              Homme</label
            >
            <label style="font-weight: 500; color: #2c3e50"
              ><input type="radio" id="F" name="gender" value="F" />
              Femme</label
            >
            <label style="font-weight: 500; color: #2c3e50"
              ><input type="radio" id="X" name="gender" value="X" /> X</label
            >
          </div>
        </div>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 0.1rem;
          "
        >
          <label
            for="address"
            style="
              font-weight: 600;
              color: #3b5998;
              text-align: left;
              min-width: 180px;
            "
            >Adresse</label
          >
          <input
            type="text"
            id="address"
            name="address"
            placeholder="Adresse"
            class="form-control"
            style="
              flex: 1;
              min-width: 350px;
              max-width: 1000px;
              border: 1.5px solid #3b8dbc;
              background: #f4f8fb;
              color: #2c3e50;
            "
          />
        </div>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 0.1rem;
          "
        >
          <label
            for="phoneNumber"
            style="
              font-weight: 600;
              color: #3b5998;
              text-align: left;
              min-width: 180px;
            "
            >Téléphone</label
          >
          <input
            type="text"
            id="phoneNumber"
            name="phoneNumber"
            placeholder="Téléphone"
            class="form-control"
            style="
              flex: 1;
              min-width: 350px;
              max-width: 1000px;
              border: 1.5px solid #3b8dbc;
              background: #f4f8fb;
              color: #2c3e50;
            "
          />
        </div>
        <span
          th:style="'color: red;'"
          th:if="${msgLastname}"
          th:utext="${msgLastname}"
          >Erreur Nom</span
        >
        <span
          th:style="'color: red;'"
          th:if="${msgFirstname}"
          th:utext="${msgFirstname}"
          >Erreur Prénom</span
        >
        <span
          th:style="'color: red;'"
          th:if="${msgBirthdate}"
          th:utext="${msgBirthdate}"
          >Erreur Date de naissance</span
        >
        <div
          style="
            display: flex;
            justify-content: flex-end;
            gap: 18px;
            margin-top: 1.5rem;
          "
        >
          <button
            type="reset"
            class="btn btn-login"
            style="
              background: #fff;
              color: #3b5998;
              border: 2px solid #3b5998;
              border-radius: 10px;
              font-weight: 600;
              padding: 0.55rem 1.5rem;
              transition: background 0.2s, color 0.2s;
              box-shadow: 0 1px 4px rgba(59, 89, 152, 0.07);
              min-width: 120px;
              text-align: center;
            "
            onmouseover="this.style.background='#3b5998';this.style.color='#fff'"
            onmouseout="this.style.background='#fff';this.style.color='#3b5998'"
          >
            Annuler
          </button>
          <button
            type="submit"
            class="btn btn-login"
            style="
              background: #3b5998;
              color: #fff;
              border: 2px solid #3b5998;
              border-radius: 10px;
              font-weight: 600;
              padding: 0.55rem 1.5rem;
              transition: background 0.2s, color 0.2s;
              box-shadow: 0 1px 4px rgba(59, 89, 152, 0.07);
              min-width: 120px;
              text-align: center;
            "
            onmouseover="this.style.background='#fff';this.style.color='#3b5998'"
            onmouseout="this.style.background='#3b5998';this.style.color='#fff'"
          >
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </body>
</html>

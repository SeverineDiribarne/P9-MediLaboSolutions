<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <!-- Google Fonts & Bootstrap CDN for modern look -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Param cache-busting to ensure the latest version of styles is loaded -->
    <link href="/css/medilabo-style.css?v=20241111" rel="stylesheet" />
</head>

<body class="login-page">
    <!-- Upper headBand with logo -->
    <div class="top-banner">
        <div class="banner-content">
            <div class="logo-img logo-frame">
                <img src="/img/medilabo-logo.png" alt="MédiLabo Solutions" />
            </div>
        </div>
    </div>

    <div class="login-main">
        <div class="login-container shadow login-frame-narrow">
            <div class="login-welcome">Bienvenue dans le site MédiLabo&nbsp;Solutions</div>
            <form th:action="@{/login}" th:object="${user}" method="POST" autocomplete="off">
                <h2>Connexion</h2>
                <input type="text" th:field="*{username}" class="form-control" placeholder="Nom d’utilisateur" required autofocus />
                <input type="password" th:field="*{password}" class="form-control" placeholder="Mot de passe" required />
                <button type="submit" class="btn btn-login">Se connecter</button>
            </form>
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>
        </div>
    </div>
</body>

</html>

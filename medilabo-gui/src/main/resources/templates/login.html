<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Google Fonts & Bootstrap CDN for modern look -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(120deg, #e0e7ef 0%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.09);
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            font-weight: 700;
            color: #3b5998;
            margin-bottom: 2rem;
            text-align: center;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 1.1em;
            margin-bottom: 1.2rem;
            border: 1px solid #dbeafe;
            background: #f4f8fb;
        }
        .form-control:focus {
            border-color: #3b5998;
            box-shadow: 0 0 0 0.2rem rgba(59,89,152,0.08);
        }
        .btn-login {
            width: 100%;
            background: #3b5998;
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-size: 1.1em;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #2c3e50;
        }
        .alert-danger {
            margin-top: 1rem;
            border-radius: 10px;
            text-align: center;
        }
        .login-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .login-icon i {
            font-size: 3rem;
            color: #3b5998;
        }
    </style>
    <!-- Bootstrap Icons CDN (for user icon) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <div class="login-container shadow">
        <div class="login-icon">
            <i class="bi bi-person-circle"></i>
        </div>
        <h2>Sign In</h2>
        <form th:action="@{/login}" th:object="${user}" method="POST" autocomplete="off">
            <input type="text" th:field="*{username}" class="form-control" placeholder="Username" required autofocus />
            <input type="password" th:field="*{password}" class="form-control" placeholder="Password" required />
            <button type="submit" class="btn btn-login">Login</button>
        </form>
        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password.
        </div>
    </div>
</body>

</html>

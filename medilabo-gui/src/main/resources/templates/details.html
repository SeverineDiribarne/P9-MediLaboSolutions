<!DOCTYPE html>
<html lang="en"  xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient details</title>
  <link href="/css/medilabo-style.css" rel="stylesheet">
  </head>
  <body>
  <!-- Bandeau supérieur -->
  <div class="top-banner">
    <div class="banner-content">
      <div class="logo-img logo-frame">
        <img src="/img/medilabo-logo.png" alt="MédiLabo Solutions" />
      </div>
      <div class="banner-actions">
        <a th:href="@{/api/patient/list}" class="btn btn-login retour-btn">Retour à la liste</a>
        <a th:href="@{/logout}" class="btn btn-danger logout-btn">Déconnexion</a>
      </div>
    </div>
  </div>
  <div style="max-width: 1800px; width: 100%; margin: 40px auto 32px auto; padding: 0 20px;">
    <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 2.2rem; position: relative; width: 100%;">
      <h2 class="heading-blue" style="margin: 0 auto; flex: 0 1 auto; text-align: center; width: 100%;">Détails du patient</h2>
      <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 200px; display: flex; justify-content: flex-end;">

      </div>
    </div>
  <div class="details-container">
  <div class="identity-card">
        <!-- Titre Identité du patient (même style que 'Notes du patient') -->
  <h3 class="section-title">Identité du patient</h3>
     
     <!-- Bloc centré pour l'affichage du risque de diabète -->
  <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:1rem;margin-bottom:0.9rem;flex-wrap:nowrap;width:100%;">
    <div style="flex:0 0 auto;font-weight:600;color:#25648f;font-size:1.05rem;letter-spacing:.5px;white-space:nowrap;">Risque de diabète :</div>
    <div th:if="${diabetesMessage != null and diabetesMessage != ''}"
      id="diabetesMessage"
      th:text="${diabetesMessage}"
      th:class="${'risk-level-box ' + (
          diabetesMessage.equalsIgnoreCase('NONE') ? 'risk-none' :
          (diabetesMessage.equalsIgnoreCase('BORDERLINE') ? 'risk-borderline' :
          (diabetesMessage.equalsIgnoreCase('IN_DANGER') ? 'risk-in-danger' :
          (diabetesMessage.equalsIgnoreCase('EARLY_ONSET') ? 'risk-early-onset' : 'risk-undetermined'))))}"
      style="flex:1 1 auto;min-width:0;"></div>
    <div th:unless="${diabetesMessage != null and diabetesMessage != ''}"
      id="diabetesMessage"
      class="risk-level-box risk-undetermined"
      style="flex:1 1 auto;min-width:0;">&nbsp;</div>
  </div>

        <form th:action="@{/api/patient/update/{id}(id=${patient.patientId})}" th:object="${patient}" method="post" class="form-vertical">
        <input type="hidden" th:field="*{patientId}" />
        <div class="form-row">
          <label class="label-main-140">Prénom</label>
          <input type="text" class="form-control input-340" th:field="*{firstname}" required />
        </div>
        <div class="form-row">
          <label class="label-main-140">Nom</label>
          <input type="text" class="form-control input-340" th:field="*{lastname}" required />
        </div>
        <div class="form-row">
          <label class="label-main-140">Date de naissance</label>
          <input type="text" class="form-control input-340" th:field="*{birthdate}" required />
        </div>
        <div class="form-row">
          <label class="label-main-140">Genre</label>
          <input type="text" class="form-control input-340" th:field="*{gender}" required />
        </div>
        <div class="form-row">
          <label class="label-main-140">Adresse</label>
          <input type="text" class="form-control input-340" th:field="*{address}" />
        </div>
        <div class="form-row">
          <label class="label-main-140">Téléphone</label>
          <input type="text" class="form-control input-340" th:field="*{phoneNumber}" />
        </div>
        <div class="actions-row">
          <div class="label-spacer-140"></div>
          <div class="actions-form-narrow">
            <button type="submit" class="btn btn-form btn-form-solid btn-split" style="width: 100%;">Modifier</button>
          </div>
        </div>
      </form>
      </div>
    <!-- Bloc notes patient à droite (unique) -->
  <div style="flex: 0 0 700px; min-width: 420px; max-width: 700px; margin-left: 0.6rem;">
  <div class="notes-panel">
        <h3 class="section-title" style="margin-bottom: 1.2rem;">Notes du patient</h3>
        <div th:if="${#lists.isEmpty(notes)}" style="color: #888;">Aucune note enregistrée.</div>
        <div th:if="${!#lists.isEmpty(notes)}" class="notes-list">
          <div th:each="note,iter : ${notes}" class="note-item">
            <!-- Formulaire d'édition (contient la zone de texte) -->
            <form th:action="@{/api/patient/notes/edit/{noteId}(noteId=${note.id})}"
                  th:attr="id=${'edit-form-' + note.id}"
                  method="post"
                  style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; width: 100%; margin: 0;">
              <input type="hidden" name="patientId" th:value="${patient.patientId}" />
              <textarea name="noteContent" class="note-textarea">[[${note.note}]]</textarea>
            </form>
            <!-- Zone d'actions côte à côte sans formulaires imbriqués -->
            <div class="note-actions">
              <button type="submit" class="btn btn-note" th:attr="form=${'edit-form-' + note.id}">Modifier</button>
              <form th:action="@{/api/patient/notes/delete/{noteId}(noteId=${note.id})}" method="post" style="margin:0;">
                <input type="hidden" name="patientId" th:value="${patient.patientId}" />
                <button type="submit" class="btn btn-note">Supprimer</button>
              </form>
            </div>
          </div>
        </div>
      </div>
  <div class="notes-add-panel">
        <h3 class="section-title" style="margin-bottom: 1.2rem;">Ajouter une note</h3>
  <form method="post" th:action="@{/api/patient/notes}" th:object="${noteForm}" style="display: flex; flex-direction: column; gap: 1rem; justify-content: flex-start;">
          <input type="hidden" th:field="*{patientId}" />
          <input type="hidden" th:field="*{patientLastname}" />
            <input type="hidden" th:field="*{patientId}" />
            <input type="hidden" th:field="*{patientLastname}" />
            <textarea th:field="*{note}" id="note" rows="5" cols="60" class="form-control note-textarea-add"></textarea>
            <button type="submit" class="btn btn-form btn-form-solid btn-split" style="margin: 0.8rem auto 0.9rem auto; min-width: 220px;">Enregistrer</button>
            <div th:if="${#fields.hasErrors('note')}" th:errors="*{note}" style="color:red"></div>
        </form>
      </div>
      </div>
    </div>
  </div>
  </body>
  
</html>

<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>Patient List </title>
  <link
          rel="stylesheet"
          type="text/css"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
  />
</head>
<body>
<div class="container" align="center">
  <a href="/api/patient/add" class="btn btn-primary btn-sm">Add new patient</a>
  <table class="table table-bordered" style="margin-top: 1%">
    <thead>
    <tr>
  <!--    <th>Id</th>   -->
      <th>Lastname</th>
      <th>Firstname</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="patient : ${patients}">
  <!--    <td th:text="${patient.patientId}"></td>   -->
      <td th:text="${patient.lastname}"></td>
      <td th:text="${patient.firstname}"></td>
      <td align="center">
        <a th:href="@{/api/patient/details/{id}(id=${patient.patientId})}">Details</a>
        &nbsp;|&nbsp;
        <a th:href="@{/api/patient/update/{id}(id=${patient.patientId})}">Edit</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient details</title>
</head>

<body>
  <div class="row">
    <h2>Add a new patient</h2>
  </div>

  <div class="row">
    <form action="#" th:action="@{/patient/add}" th:object="${patient}" method="post" class="form-horizontal"
      align="center" style="width: 100%">
      <!-- Create a form to input the values of Patient, there are 2 buttons: Save data and cancel to the list PatientList -->

      <label>Lastname</label><br />
      <input type="text" th:field="*{lastname}" placeholder="Lastname" required/><br />
      <label>Firstname</label><br />
      <input type="text" th:field="*{firstname}" placeholder="Firstname" required /><br />
      <label>BirthDate</label><br />
      <input type="text" th:field="*{birthdate}" placeholder="BirthDate" required />
      <br />
      <label>Gender</label><br />
      <div>
        <input type="radio" id="genderChoice1" name="gender" value="Male" checked/>
        <label for="genderChoice1">Male</label>

        <input type="radio" id="genderChoice2" name="gender" value="Female" />
        <label for="genderChoice2">Female</label>

        <input type="radio" id="genderChoice3" name="gender" value="X" />
        <label for="genderChoice3">X</label>
      </div>
      <br />
      <label>Address</label><br />
      <input type="text" th:field="*{address}" placeholder="Address" />
      <br />
      <label>Phone number</label><br />
      <input type="text" th:field="*{phoneNumber}" placeholder="Phone Number" />
      <br />
      <span th:style="'color: red;'" th:if="${msgLastname}" th:utext="${msgLastname}">Error Lastname</span><br />
      <span th:style="'color: red;'" th:if="${msgFirstname}" th:utext="${msgFirstname}">Error Firstname</span><br />
      <span th:style="'color: red;'" th:if="${msgBirthdate}" th:utext="${msgBirthdate}">Error Birthdate</span><br />
      <div class="form-group">
        <div class="col-sm-12">
          <a href="/patient/list" class="btn btn-danger" style="margin-top: 0.5%">Cancel</a>
          <input type="submit" class="btn btn-primary" value="Add Patient" style="margin-top: 0.5%" />
        </div>
      </div>
    </form>
  </div>
</body>

</html>

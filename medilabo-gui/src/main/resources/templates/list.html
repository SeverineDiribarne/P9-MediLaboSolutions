<!DOCTYPE html>
<html
  lang="fr"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient List</title>
    <link href="/css/medilabo-style.css?v=20241111" rel="stylesheet" />
  </head>
  <body>
    <!-- Bandeau supérieur -->
    <div class="top-banner">
      <div class="banner-content">
        <div class="logo-img logo-frame">
          <img src="/img/medilabo-logo.png" alt="MédiLabo Solutions" />
        </div>
        <a th:href="@{/logout}" class="btn btn-danger logout-btn"
          >Déconnexion</a
        >
      </div>
    </div>
    <div class="container container-main">
      <div class="list-header">
        <h2 class="heading-blue">
          Liste des patients
        </h2>
        <a href="/api/patient/add" class="btn btn-login btn-add">+ Ajouter un patient</a>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle table-card">
          <thead>
            <tr style="color: #fff">
              <th>Nom</th>
              <th>Prénom</th>
              <th class="col-date">Date de naissance</th>
              <th class="col-actions">
                Actions
              </th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="patient,iterStat : ${patients}"
              th:classappend="${iterStat.index % 2 == 0} ? 'row-even' : 'row-odd'">
              <td th:text="${patient.lastname}"></td>
              <td th:text="${patient.firstname}"></td>
              <td class="col-date" th:text="${patient.birthdate}"></td>
              <td>
                <div class="actions-flex">
                  <a
                    th:href="@{/api/patient/details/{id}(id=${patient.patientId})}"
                    class="btn btn-med btn-med-outline"
                    >Détails</a
                  >
                  <a
                    th:href="@{/api/patient/update/{id}(id=${patient.patientId})}"
                    class="btn btn-med btn-med-solid"
                    >Modifier</a
                  >
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- Le bouton de déconnexion est maintenant dans le bandeau -->
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Details</title>
</head>
<body>
<h1>Edit User Information</h1>
<form th:action="@{/savePatient}" th:object="${patient}" method="post">
  <div>
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" th:field="*{firstName}" />
  </div>
  <div>
    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" th:field="*{lastName}" />
  </div>
  <div>
    <label for="birthDate">Birth Date:</label>
    <input type="text" id="birthDate" th:field="*{birthDate}" />
  </div>
  <div>
    <label>Gender:</label>
    <input type="radio" id="male" name="gender" value="Male" th:field="*{gender}" /> Male
    <input type="radio" id="female" name="gender" value="Female" th:field="*{gender}" /> Female
    <input type="radio" id="X" name="gender" value="X" th:field="*{gender}" /> X

  </div>
  <div>
    <label for="address">Address:</label>
    <input type="text" id="address" th:field="*{address}" />
  </div>
  <div>
    <label for="phoneNumber">Phone Number:</label>
    <input type="text" id="phoneNumber" th:field="*{phoneNumber}" />
  </div>
  <div>
    <button type="submit">Save</button>
  </div>
</form>
</body>
</html>

    key-alias: springboot
spring:
 security:
    oauth2:
      resourceserver:
        jwt:
          secret-key-location: classpath:hmac256.key
 cloud:
    gateway:
     httpclient:
        ssl:
          use-insecure-trust-manager: true
     globalcors:
            globalcors:
              cors-configurations:
                '[/**]':
                  allowedOrigins: "https://localhost:8443"
                  allowedMethods: GET, POST, PUT, DELETE, OPTIONS
                  allowedHeaders: "*"
                  allowCredentials: true

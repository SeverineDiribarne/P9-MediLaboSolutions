# Docker profile: use compose service names and credentials
server.port=8082

spring.application.name=medilabo-back
spring.datasource.url=jdbc:mysql://mysql:3306/mydatabase?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Debug & logs détaillés
debug=true
logging.level.root=DEBUG
spring.jpa.show-sql=true
# Hibernate 6 (Spring Boot 3): SQL + bindings
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Flyway et Spring Security
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.security=DEBUG

# Derrière un reverse proxy (Nginx) : HTTP interne, prise en compte des en-têtes
server.ssl.enabled=false
server.forward-headers-strategy=framework

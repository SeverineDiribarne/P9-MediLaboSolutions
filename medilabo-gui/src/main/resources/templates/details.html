<!DOCTYPE html>
<html lang="en"  xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient details</title>
  </head>
  <body>
  <h1>Patient Details</h1>
  <p>Id: <span th:text="${patient.patientId}"></span></p>
  <p>First Name: <span th:text="${patient.firstname}"></span></p>
  <p>Last Name: <span th:text="${patient.lastname}"></span></p>
  <p>Gender: <span th:text="${patient.gender}"></span></p>
  <p>Address: <span th:text="${patient.address}"></span></p>
  <p>Phone Number: <span th:text="${patient.phoneNumber}"></span></p>

  <!-- Pour ajouter une date et une note sur le patient -->
<form method="post" th:action="@{/notes}" th:object="${patient}">
   <p>
       <label for="note">Notes :</label><br />
       <input type="date" th:field="*{date}" />
       <textarea name="note" id="note" th:text="${note}"></textarea>
   </p>
   <button type="submit">Valider</button>
</form>

<!-- Pour afficher la date et la note enregistrée dans la base de données -->
<p>Notes du patient :</p>
<div>
    <span th:date="${date}"></span>
    <span th:text="${note}"></span>
</div>

  <a th:href="@{/api/patient/list}">Back to Patient List</a>
  </body>
</html>

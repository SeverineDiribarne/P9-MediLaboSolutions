<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container" align="center">
      <table class="table table-bordered" style="margin-top: 1%">
        <thead>
          <tr>
            <th>Id</th>
            <th>Lastname</th>
            <th>Firstname</th>
          </tr>
        </thead>
        <tbody>
          <!-- Show all Bids to the table, the Action column will have Edit & Delete buttons -->
          <a href="/patient/add" class="btn btn-primary btn-sm"
            >Add new patient</a
          >
          <br />
          <tr th:each="patient:${patients}">
            <td th:text="${patient.patientId}"></td>
            <a href="/patient/details">
              <td th:text="${patient.lastname}"></td>
              <td th:text="${patient.firstname}"></td>
            </a>

            <td align="center">
              <a th:href="@{'update/'+${bidList.bidListId}}">Edit</a
              >&nbsp;|&nbsp;
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
